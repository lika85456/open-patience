# Build installable APKs without any signing secrets.
# The production flavor falls back to debug signing when key.properties is
# absent, which is enough for sideloading onto a phone or tablet.
name: Build Czech APK

on:
  workflow_dispatch:
  push:
    branches:
      - czech

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      # Gradle 8.14 does not support the JDK 25 preinstalled on the runner.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify
        run: |
          flutter analyze
          flutter test

      - name: Build APKs
        run: flutter build apk --release --flavor production --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: open-patience-czech-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
